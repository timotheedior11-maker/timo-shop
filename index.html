<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Timo Shop - Boutique en ligne</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
    }

    .hero {
      background: white;
      padding: 30px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      margin-bottom: 7px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .order {
      display: block;
      background: #25D366;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 20px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ Timo Shop</h1>
    <p>Votre boutique en ligne</p>
  </header>

  <section class="hero">
    <h2>Bienvenue chez Timo Shop</h2>
    <p>Découvrez nos produits et commandez directement sur WhatsApp.</p>
  </section>

  <section class="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>T-Shirt</h3>
        <p class="price">5 000 FCFA</p>
        <a class="order" href="https://wa.me/2290168465541" target="_blank">
          Commander
        </a>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>Jean</h3>
        <p class="price">8 000 FCFA</p>
        <a class="order" href="https://wa.me/2290168465541" target="_blank">
          Commander
        </a>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>Chemise</h3>
        <p class="price">7 000 FCFA</p>
        <a class="order" href="https://wa.me/2290168465541" target="_blank">
          Commander
        </a>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>Robe</h3>
        <p class="price">10 000 FCFA</p>
        <a class="order" href="https://wa.me/2290168465541" target="_blank">
          Commander
        </a>
      </div>
    </div>

  </section>

  <footer>
    <p>📞 WhatsApp : +2290168465541</p>
    <p>© 2026 Timo Shop</p>
  </footer>

</body>
  </html>
